<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Central de Medidores — Protocolo & Rastreio</title>
  
  <!-- SheetJS para leitura e exportação Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Html5-QRCode para leitura de Código de Barras pela câmera -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #0b1120;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --critical: #b91c1c;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: var(--primary);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: block;
    }

    /* UPLOAD DE BASES (SAP & BI) */
    .bases-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .upload-pill {
      background: var(--bg-input);
      border: 1px dashed var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      color: var(--text-main);
    }

    .upload-pill:hover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.08);
    }

    .upload-pill.loaded {
      border-style: solid;
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.12);
    }

    .upload-pill input {
      display: none;
    }

    /* NAVEGAÇÃO DE ABAS */
    .tabs-wrapper {
      background: #131c31;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      overflow-x: auto;
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 14px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: rgba(59, 130, 246, 0.06);
    }

    .tab-badge {
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .tab-btn.active .tab-badge {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* CONTAINER PRINCIPAL */
    main {
      max-width: 1440px;
      margin: 24px auto;
      padding: 0 20px;
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* CARDS & FORMULÁRIOS */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      align-items: end;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .serial-input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"], select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* BOTÕES */
    .btn {
      padding: 11px 16px;
      border-radius: 8px;
      border: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-camera {
      background: #0ea5e9;
      color: white;
      padding: 11px 14px;
    }
    .btn-camera:hover { background: #0284c7; }

    .btn-success {
      background: var(--success);
      color: #064e3b;
      font-weight: 700;
    }
    .btn-success:hover { filter: brightness(1.1); }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* TABELAS */
    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }

    thead {
      background: #131c31;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.74rem;
      letter-spacing: 0.05em;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    /* BADGES DE PRAZO E STATUS */
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      display: inline-block;
      text-transform: uppercase;
    }

    .badge-dentro {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .badge-alerta {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .badge-critico {
      background: rgba(239, 68, 68, 0.25);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.5);
    }

    .badge-fora {
      background: rgba(185, 28, 28, 0.35);
      color: #fca5a5;
      border: 1px solid #ef4444;
    }

    .badge-nao-encontrado {
      background: rgba(148, 163, 184, 0.18);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.4);
    }

    /* MODAL DA CÂMERA */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    #reader {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e293b;
      border-left: 4px solid var(--primary);
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      font-size: 0.88rem;
      z-index: 1000;
      display: none;
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO E IMPORTAÇÃO DE BASES -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <i data-lucide="cpu"></i>
      </div>
      <div>
        <h1>Central de Medidores</h1>
        <span>Protocolo Operacional • Cruzamento SAP & BI Equatorial</span>
      </div>
    </div>

    <div class="bases-bar">
      <label class="upload-pill" id="lbl-sap">
        <i data-lucide="database" size="16"></i>
        <span id="txt-sap">Importar Base SAP (.xlsx/.csv)</span>
        <input type="file" id="file-sap" accept=".xlsx,.xls,.csv" />
      </label>

      <label class="upload-pill" id="lbl-bi">
        <i data-lucide="bar-chart-3" size="16"></i>
        <span id="txt-bi">Importar BI Equatorial (.xlsx/.csv)</span>
        <input type="file" id="file-bi" accept=".xlsx,.xls,.csv" />
      </label>
    </div>
  </header>

  <!-- NAVEGAÇÃO DE ABAS -->
  <nav class="tabs-wrapper" id="tabs-nav">
    <button class="tab-btn active" data-tab="consulta">
      <i data-lucide="search" size="16"></i> Consulta Rápida
      <span class="tab-badge" id="count-consulta">0</span>
    </button>
    <button class="tab-btn" data-tab="expedicao">
      <i data-lucide="truck" size="16"></i> Expedição
      <span class="tab-badge" id="count-expedicao">0</span>
    </button>
    <button class="tab-btn" data-tab="recebimento">
      <i data-lucide="package-check" size="16"></i> Recebimento
      <span class="tab-badge" id="count-recebimento">0</span>
    </button>
    <button class="tab-btn" data-tab="devolvido">
      <i data-lucide="rotate-ccw" size="16"></i> Devolvido Novo
      <span class="tab-badge" id="count-devolvido">0</span>
    </button>
    <button class="tab-btn" data-tab="sucata">
      <i data-lucide="trash-2" size="16"></i> Sucata / Obsoleto
      <span class="tab-badge" id="count-sucata">0</span>
    </button>
  </nav>

  <!-- CONTEÚDO DAS ABAS -->
  <main id="panels-container">
    <!-- Os painéis são renderizados dinamicamente para garantir funcionamento idêntico e sem bugs -->
  </main>

  <!-- MODAL CÂMERA CÓDIGO DE BARRAS -->
  <div class="modal-overlay" id="camera-modal">
    <div class="modal-box">
      <div class="modal-header">
        <strong style="display:flex;align-items:center;gap:8px;">
          <i data-lucide="scan-barcode"></i> Ler Código de Barras
        </strong>
        <button class="btn btn-danger" style="padding:6px 12px;" onclick="fecharCamera()">Fechar</button>
      </div>
      <div id="reader"></div>
      <p style="font-size:0.78rem; color:var(--text-muted); margin-top:10px; text-align:center;">
        Aponte a câmera traseira para o código de barras do medidor. A leitura é automática.
      </p>
    </div>
  </div>

  <!-- TOAST DE NOTIFICAÇÃO -->
  <div class="toast" id="toast"></div>

  <script>
    // ==========================================
    // CONFIGURAÇÃO DAS ABAS DO SISTEMA
    // ==========================================
    const ABAS_CONFIG = [
      { id: 'consulta',    nome: 'Consulta Rápida (BI + SAP)',       extraLabel: 'Observação / Filtro', extraPlaceholder: 'Opcional...' },
      { id: 'expedicao',   nome: 'Protocolo de Expedição',           extraLabel: 'Equipe / Destino',    extraPlaceholder: 'Ex: Equipe EQ-102 / Base Maceió' },
      { id: 'recebimento', nome: 'Protocolo de Recebimento',         extraLabel: 'Origem / Nota',       extraPlaceholder: 'Ex: Almoxarifado Central / NF' },
      { id: 'devolvido',   nome: 'Protocolo de Devolvido Novo',      extraLabel: 'Motivo Devolução',    extraPlaceholder: 'Ex: Sobra de obra / Cancelada' },
      { id: 'sucata',      nome: 'Protocolo de Sucata / Obsoleto',   extraLabel: 'Diagnóstico',         extraPlaceholder: 'Ex: Visor queimado / Avariado' }
    ];

    // Estado em memória + persistência no navegador
    let baseSAP = JSON.parse(localStorage.getItem('cm_base_sap') || '{}');
    let baseBI  = JSON.parse(localStorage.getItem('cm_base_bi')  || '{}');
    let registrosPorAba = JSON.parse(localStorage.getItem('cm_registros') || '{"consulta":[],"expedicao":[],"recebimento":[],"devolvido":[],"sucata":[]}');

    let html5QrCode = null;
    let abaCameraAtual = null;

    // ==========================================
    // INICIALIZAÇÃO DA INTERFACE
    // ==========================================
    function inicializar() {
      const container = document.getElementById('panels-container');
      container.innerHTML = '';

      ABAS_CONFIG.forEach((aba, idx) => {
        const section = document.createElement('section');
        section.className = `tab-panel ${idx === 0 ? 'active' : ''}`;
        section.id = `panel-${aba.id}`;

        section.innerHTML = `
          <div class="card">
            <div class="card-header">
              <div class="card-title">
                <i data-lucide="layers" size="18" color="#3b82f6"></i>
                ${aba.nome}
              </div>
              <div class="actions-bar">
                <button class="btn btn-success" onclick="exportarExcel('${aba.id}')">
                  <i data-lucide="download" size="16"></i> Exportar Excel
                </button>
                <button class="btn btn-danger" onclick="limparAba('${aba.id}')">
                  <i data-lucide="eraser" size="16"></i> Limpar
                </button>
              </div>
            </div>

            <div class="input-grid">
              <div class="field-group" style="grid-column: span 2;">
                <label>Número de Série do Medidor</label>
                <div class="serial-input-row">
                  <input type="text" id="input-serie-${aba.id}" placeholder="Digite ou bipe o número de série..." autocomplete="off"
                    onkeydown="if(event.key==='Enter'){ adicionarMedidor('${aba.id}'); }" />
                  <button type="button" class="btn btn-camera" onclick="abrirCamera('${aba.id}')" title="Ler código de barras com a câmera">
                    <i data-lucide="camera" size="18"></i> Câmera
                  </button>
                </div>
              </div>

              <div class="field-group">
                <label>${aba.extraLabel}</label>
                <input type="text" id="input-extra-${aba.id}" placeholder="${aba.extraPlaceholder}"
                  onkeydown="if(event.key==='Enter'){ adicionarMedidor('${aba.id}'); }" />
              </div>

              <div class="field-group">
                <button type="button" class="btn btn-primary" style="width:100%;" onclick="adicionarMedidor('${aba.id}')">
                  <i data-lucide="plus-circle" size="18"></i> Adicionar Medidor
                </button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Número de Série</th>
                    <th>Material</th>
                    <th>DEP</th>
                    <th>Status Usuário</th>
                    <th>Status Sistema</th>
                    <th>Data Últ. Movimentação</th>
                    <th>Data Instalação</th>
                    <th>Prazo</th>
                    <th>${aba.extraLabel}</th>
                    <th>Ação</th>
                  </tr>
                </thead>
                <tbody id="tbody-${aba.id}"></tbody>
              </table>
            </div>
          </div>
        `;
        container.appendChild(section);
      });

      // Configura cliques das abas (Correção definitiva)
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-tab');
          trocarAba(target);
        });
      });

      // Atualiza indicadores das bases já salvas no cache
      atualizarStatusBases();

      // Renderiza tabelas salvas
      ABAS_CONFIG.forEach(aba => renderizarTabela(aba.id));
      lucide.createIcons();
    }

    function trocarAba(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

      const btnAtivo = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
      const panelAtivo = document.getElementById(`panel-${tabId}`);

      if (btnAtivo) btnAtivo.classList.add('active');
      if (panelAtivo) panelAtivo.classList.add('active');

      // Foca automaticamente no campo de série da aba aberta
      const input = document.getElementById(`input-serie-${tabId}`);
      if (input) setTimeout(() => input.focus(), 80);
    }

    // ==========================================
    // LEITURA E NORMALIZAÇÃO DE PLANILHAS (SAP & BI)
    // ==========================================
    function normalizarChave(str) {
      return String(str || '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '');
    }

    function normalizarSerie(serie) {
      return String(serie || '').trim().toUpperCase().replace(/^0+/, '');
    }

    function formatarDataExcel(valor) {
      if (!valor && valor !== 0) return '';
      if (typeof valor === 'number') {
        const date = new Date(Math.round((valor - 25569) * 86400 * 1000));
        if (!isNaN(date.getTime())) {
          return date.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
        }
      }
      return String(valor).trim();
    }

    function extrairCampo(row, possiveisNomes) {
      const chaves = Object.keys(row);
      for (const alvo of possiveisNomes) {
        const alvoNorm = normalizarChave(alvo);
        const encontrada = chaves.find(k => normalizarChave(k) === alvoNorm || normalizarChave(k).includes(alvoNorm));
        if (encontrada && row[encontrada] !== undefined && row[encontrada] !== null && String(row[encontrada]).trim() !== '') {
          return row[encontrada];
        }
      }
      return '';
    }

    function processarArquivoPlanilha(file, tipo) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

          const mapa = {};
          rows.forEach(row => {
            const serieBruta = extrairCampo(row, ['numeroserie', 'serie', 'serial', 'medidor', 'nserie', 'equipamento']);
            const serie = normalizarSerie(serieBruta);
            if (!serie) return;

            mapa[serie] = {
              serieOriginal: String(serieBruta).trim(),
              material:      String(extrairCampo(row, ['material', 'codmaterial', 'codigo', 'modelo']) || '').trim(),
              dep:           String(extrairCampo(row, ['dep', 'deposito', 'almoxarifado', 'centro']) || '').trim(),
              statusUsuario: String(extrairCampo(row, ['statususuario', 'statususu', 'stusuario', 'status_usuario']) || '').trim(),
              statusSistema: String(extrairCampo(row, ['statussistema', 'statussis', 'stsistema', 'status_sistema', 'status']) || '').trim(),
              dataMov:       formatarDataExcel(extrairCampo(row, ['dataultimamovimentacao', 'datamovimentacao', 'ultimamovimentacao', 'datamov', 'modificadoem', 'data'])),
              dataInst:      formatarDataExcel(extrairCampo(row, ['datainstalacao', 'instalacao', 'dtinstalacao', 'data_instalacao'])),
              prazo:         String(extrairCampo(row, ['prazo', 'statusprazo', 'situacaoprazo', 'criticidade', 'aging']) || '').trim()
            };
          });

          if (tipo === 'SAP') {
            baseSAP = mapa;
            localStorage.setItem('cm_base_sap', JSON.stringify(baseSAP));
          } else {
            baseBI = mapa;
            localStorage.setItem('cm_base_bi', JSON.stringify(baseBI));
          }

          atualizarStatusBases();
          reprocessarRegistrosExistentes();
          mostrarToast(`Base ${tipo} carregada com ${Object.keys(mapa).length} medidores!`);
        } catch (err) {
          alert(`Erro ao ler arquivo ${tipo}: ` + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    document.getElementById('file-sap').addEventListener('change', e => {
      if (e.target.files[0]) processarArquivoPlanilha(e.target.files[0], 'SAP');
    });

    document.getElementById('file-bi').addEventListener('change', e => {
      if (e.target.files[0]) processarArquivoPlanilha(e.target.files[0], 'BI');
    });

    function atualizarStatusBases() {
      const qtdSap = Object.keys(baseSAP).length;
      const qtdBi  = Object.keys(baseBI).length;

      if (qtdSap > 0) {
        document.getElementById('lbl-sap').classList.add('loaded');
        document.getElementById('txt-sap').textContent = `SAP Carregado (${qtdSap})`;
      }
      if (qtdBi > 0) {
        document.getElementById('lbl-bi').classList.add('loaded');
        document.getElementById('txt-bi').textContent = `BI Equatorial (${qtdBi})`;
      }
    }

    // ==========================================
    // CRUZAMENTO DE DADOS (BI EQUATORIAL + SAP)
    // ==========================================
    function consultarMedidorNasBases(serieDigitada) {
      const chave = normalizarSerie(serieDigitada);
      const sap = baseSAP[chave] || null;
      const bi  = baseBI[chave]  || null;

      if (!sap && !bi) {
        return {
          encontrado: false,
          serie: serieDigitada.trim(),
          material: '-',
          dep: '-',
          statusUsuario: '-',
          statusSistema: '-',
          dataMov: '-',
          dataInst: '-',
          prazo: 'NÃO ENCONTRADO'
        };
      }

      // Mescla priorizando dados preenchidos entre BI e SAP
      const material      = (bi && bi.material)      || (sap && sap.material)      || '-';
      const dep           = (sap && sap.dep)           || (bi && bi.dep)           || '-';
      const statusUsuario = (sap && sap.statusUsuario) || (bi && bi.statusUsuario) || '-';
      const statusSistema = (sap && sap.statusSistema) || (bi && bi.statusSistema) || '-';
      const dataMov       = (bi && bi.dataMov)       || (sap && sap.dataMov)       || '-';
      const dataInst      = (bi && bi.dataInst)      || (sap && sap.dataInst)      || '-';
      let prazo           = (bi && bi.prazo)         || (sap && sap.prazo)         || '';

      // Se a planilha não trouxer a coluna Prazo preenchida, calcula automaticamente pela Data de Movimentação
      if (!prazo && dataMov !== '-') {
        prazo = calcularPrazoPorData(dataMov);
      }
      if (!prazo) prazo = 'DENTRO DO PRAZO';

      return {
        encontrado: true,
        serie: (bi && bi.serieOriginal) || (sap && sap.serieOriginal) || serieDigitada.trim(),
        material,
        dep,
        statusUsuario,
        statusSistema,
        dataMov,
        dataInst,
        prazo: prazo.toUpperCase()
      };
    }

    function calcularPrazoPorData(dataStr) {
      const partes = dataStr.split('/');
      if (partes.length !== 3) return 'DENTRO DO PRAZO';
      const dt = new Date(partes[2], partes[1] - 1, partes[0]);
      if (isNaN(dt.getTime())) return 'DENTRO DO PRAZO';

      const dias = Math.floor((new Date() - dt) / (1000 * 60 * 60 * 24));
      if (dias > 30) return 'FORA DO PRAZO';
      if (dias >= 20) return 'CRÍTICO';
      if (dias >= 10) return 'ALERTA';
      return 'DENTRO DO PRAZO';
    }

    function obterClasseBadgePrazo(prazo) {
      const p = String(prazo || '').toUpperCase();
      if (p.includes('NÃO ENCONTRADO') || p.includes('NAO ENCONTRADO')) return 'badge-nao-encontrado';
      if (p.includes('FORA')) return 'badge-fora';
      if (p.includes('CRIT') || p.includes('CRÍT')) return 'badge-critico';
      if (p.includes('ALERTA')) return 'badge-alerta';
      return 'badge-dentro';
    }

    // ==========================================
    // MANIPULAÇÃO DE REGISTROS E PERSISTÊNCIA
    // ==========================================
    function adicionarMedidor(abaId) {
      const inputSerie = document.getElementById(`input-serie-${abaId}`);
      const inputExtra = document.getElementById(`input-extra-${abaId}`);

      const serie = inputSerie.value.trim();
      const extra = inputExtra.value.trim();

      if (!serie) {
        mostrarToast('Digite ou leia o número de série do medidor.');
        inputSerie.focus();
        return;
      }

      const dadosCruzados = consultarMedidorNasBases(serie);
      dadosCruzados.extra = extra || '-';
      dadosCruzados.horaRegistro = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

      // Adiciona no topo da lista da aba
      registrosPorAba[abaId].unshift(dadosCruzados);
      salvarRegistros();
      renderizarTabela(abaId);

      inputSerie.value = '';
      inputSerie.focus();

      if (!dadosCruzados.encontrado) {
        mostrarToast(`Medidor ${serie}: NÃO ENCONTRADO nas bases.`);
      } else {
        mostrarToast(`Medidor ${serie} adicionado (${dadosCruzados.prazo}).`);
      }
    }

    function removerItem(abaId, index) {
      registrosPorAba[abaId].splice(index, 1);
      salvarRegistros();
      renderizarTabela(abaId);
    }

    function limparAba(abaId) {
      if (!registrosPorAba[abaId] || registrosPorAba[abaId].length === 0) {
        mostrarToast('Esta aba já está limpa.');
        return;
      }
      if (confirm('Deseja realmente limpar todos os medidores desta aba?')) {
        registrosPorAba[abaId] = [];
        salvarRegistros();
        renderizarTabela(abaId);
        mostrarToast('Base da aba limpa com sucesso!');
      }
    }

    function reprocessarRegistrosExistentes() {
      ABAS_CONFIG.forEach(aba => {
        registrosPorAba[aba.id] = registrosPorAba[aba.id].map(item => {
          const atualizado = consultarMedidorNasBases(item.serie);
          atualizado.extra = item.extra;
          return atualizado;
        });
        renderizarTabela(aba.id);
      });
      salvarRegistros();
    }

    function salvarRegistros() {
      localStorage.setItem('cm_registros', JSON.stringify(registrosPorAba));
    }

    function renderizarTabela(abaId) {
      const tbody = document.getElementById(`tbody-${abaId}`);
      const lista = registrosPorAba[abaId] || [];

      // Atualiza contador na aba
      const badgeCount = document.getElementById(`count-${abaId}`);
      if (badgeCount) badgeCount.textContent = lista.length;

      if (lista.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="11" class="empty-state">
              Nenhum medidor bipado ou digitado nesta guia. Os registros ficarão salvos aqui até você clicar em <strong>Limpar</strong>.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = lista.map((item, idx) => `
        <tr>
          <td>${lista.length - idx}</td>
          <td><strong>${item.serie}</strong></td>
          <td>${item.material}</td>
          <td>${item.dep}</td>
          <td>${item.statusUsuario}</td>
          <td>${item.statusSistema}</td>
          <td>${item.dataMov}</td>
          <td>${item.dataInst}</td>
          <td><span class="badge ${obterClasseBadgePrazo(item.prazo)}">${item.prazo}</span></td>
          <td>${item.extra}</td>
          <td>
            <button class="btn btn-danger" style="padding:5px 9px;font-size:0.75rem;" onclick="removerItem('${abaId}', ${idx})">
              Remover
            </button>
          </td>
        </tr>
      `).join('');
    }

    // ==========================================
    // EXPORTAÇÃO PARA EXCEL (.XLSX)
    // ==========================================
    function exportarExcel(abaId) {
      const lista = registrosPorAba[abaId] || [];
      if (lista.length === 0) {
        mostrarToast('Não há dados nesta aba para exportar.');
        return;
      }

      const dadosPlanilha = lista.map((item, i) => ({
        'Item': i + 1,
        'Número de Série': item.serie,
        'Material': item.material,
        'DEP': item.dep,
        'Status Usuário': item.statusUsuario,
        'Status Sistema': item.statusSistema,
        'Data Última Movimentação': item.dataMov,
        'Data de Instalação': item.dataInst,
        'Prazo': item.prazo,
        'Informação Adicional': item.extra
      }));

      const ws = XLSX.utils.json_to_sheet(dadosPlanilha);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, abaId.toUpperCase());
      XLSX.writeFile(wb, `Protocolo_${abaId.toUpperCase()}_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // ==========================================
    // LEITOR DE CÓDIGO DE BARRAS PELA CÂMERA
    // ==========================================
    function abrirCamera(abaId) {
      abaCameraAtual = abaId;
      const modal = document.getElementById('camera-modal');
      modal.classList.add('open');

      html5QrCode = new Html5Qrcode("reader");
      const config = {
        fps: 15,
        qrbox: { width: 280, height: 140 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          // Sucesso na leitura do código de barras
          const input = document.getElementById(`input-serie-${abaCameraAtual}`);
          if (input) {
            input.value = decodedText.trim();
            fecharCamera();
            adicionarMedidor(abaCameraAtual);
          }
        },
        () => {} // Ignora frames sem leitura
      ).catch(err => {
        alert("Não foi possível acessar a câmera. Verifique as permissões do navegador ou use HTTPS/localhost.\nErro: " + err);
        fecharCamera();
      });
    }

    function fecharCamera() {
      const modal = document.getElementById('camera-modal');
      modal.classList.remove('open');
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
        }).catch(() => {});
      }
    }

    // ==========================================
    // UTILITÁRIOS
    // ==========================================
    function mostrarToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.style.display = 'none';
      }, 3200);
    }

    // Inicializa tudo ao abrir
    window.addEventListener('DOMContentLoaded', inicializar);
  </script>
</body>
