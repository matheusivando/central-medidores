<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Central de Medidores — Protocolo & Rastreio</title>
  
  <!-- SheetJS para leitura e exportação Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Html5-QRCode para leitura de Código de Barras pela câmera -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #0b1120;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --critical: #b91c1c;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: var(--primary);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: block;
    }

    /* UPLOAD & CADASTRO MANUAL DE BASES (SAP & BI) */
    .bases-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .upload-pill {
      background: var(--bg-input);
      border: 1px dashed var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      color: var(--text-main);
    }

    .upload-pill:hover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.08);
    }

    .upload-pill.loaded {
      border-style: solid;
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.12);
    }

    .upload-pill input {
      display: none;
    }

    .btn-manual-base {
      background: rgba(139, 92, 246, 0.16);
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #c4b5fd;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-manual-base:hover {
      background: #7c3aed;
      color: #fff;
    }

    /* NAVEGAÇÃO DE ABAS */
    .tabs-wrapper {
      background: #131c31;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      overflow-x: auto;
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 14px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: rgba(59, 130, 246, 0.06);
    }

    .tab-badge {
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .tab-btn.active .tab-badge {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* CONTAINER PRINCIPAL */
    main {
      max-width: 1440px;
      margin: 24px auto;
      padding: 0 20px;
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* CARDS & FORMULÁRIOS */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .serial-input-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    input[type="text"], input[type="date"], select, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea {
      resize: vertical;
      min-height: 82px;
      line-height: 1.45;
      font-family: monospace;
    }

    input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .helper-hint {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    /* BOTÕES */
    .btn {
      padding: 11px 16px;
      border-radius: 8px;
      border: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-camera {
      background: #0ea5e9;
      color: white;
      padding: 11px 14px;
    }
    .btn-camera:hover { background: #0284c7; }

    .btn-success {
      background: var(--success);
      color: #064e3b;
      font-weight: 700;
    }
    .btn-success:hover { filter: brightness(1.1); }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* TABELAS */
    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }

    thead {
      background: #131c31;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.74rem;
      letter-spacing: 0.05em;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    /* BADGES DE PRAZO E STATUS */
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74
